# Manually-triggerable CPU image build, channel-aware (ADR-0004). The `channel`
# input selects the registry repo, tag scheme, OCI labels, and built source:
#   upstream  bare upstream vLLM at `ref`. Repo path IS the channel signal:
#               ghcr.io/blackfuel-ai/bf-vllm/upstream/vllm-openai-cpu:sha-<short>
#               …:vX.Y.Z (upstream release tags); …:latest (upstream-main only)
#   dev       bf-vllm tree at `ref`, shared repo, label-routed, never auto-deployed:
#               …/vllm-openai-cpu:<base-version>-dev-<sha7>
#   release   bf-vllm tree at the release ref, via bf-release.yml's git_tag:
#               …/vllm-openai-cpu:<upstream>_bf.<bf>  +  :<upstream>_bf-latest  +  :bf-stable
#
# Per ADR-0005 caching is the Blacksmith-native builder cache; vLLM's
# USE_SCCACHE is left off (redundant for a build this light).

name: bf-build-cpu-image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel (ADR-0004): upstream (bare upstream), dev (bf-vllm tree, preview), release (bf-vllm tree at a release tag)."
        type: choice
        required: true
        default: upstream
        options:
          - upstream
          - dev
          - release
      ref:
        description: "Source ref to build. upstream: a vLLM ref (branch/tag/SHA) or upstream-main. dev/release: a bf-vllm ref (branch/SHA/tag)."
        type: string
        required: true
        default: upstream-main
      git_tag:
        description: "Release git tag (release channel only), e.g. v0.23.1rc0+bf.0.1.0. Mapped to the OCI image tag via bf-tools/version.py."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  # Keyed on channel+ref so an upstream build never cancels a dev build.
  group: bf-build-cpu-${{ github.event.inputs.channel }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 + tags so the dev channel can `git describe` the tree.
      - name: Checkout source at ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Resolve channel, image repository, and provenance
        id: prov
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          REF: ${{ github.event.inputs.ref }}
          GIT_TAG: ${{ github.event.inputs.git_tag }}
          OWNER_IMAGE: ghcr.io/blackfuel-ai/bf-vllm
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:7}"

          # version: set only when `ref` is an upstream release tag (vX.Y.Z[rcN]);
          # empty for a between-tags upstream build (sha pin + :latest only).
          if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            version="$REF"
          else
            version=""
          fi

          case "$CHANNEL" in
            upstream)
              # ADR-0004: dedicated upstream repo path is the channel signal.
              image="${OWNER_IMAGE}/upstream/vllm-openai-cpu"
              ;;
            dev|release)
              image="${OWNER_IMAGE}/vllm-openai-cpu"
              ;;
            *)
              echo "::error::Unknown channel '${CHANNEL}'." >&2
              exit 1
              ;;
          esac

          # scm_version: tree self-description; prefer the BF release line, fall
          # back to the upstream tag line. `+` -> `_` for OCI. Never fails.
          scm_raw="$(git describe --tags --match 'v*+bf.*' HEAD 2>/dev/null \
                  || git describe --tags --match 'v[0-9]*' HEAD)"
          scm_version="${scm_raw//+/_}"

          # dev_image_tag: built by the single source of truth (bf-tools/version.py).
          dev_image_tag=""
          if [ "$CHANNEL" = "dev" ]; then
            dev_image_tag="$(python -c 'import sys; sys.path.insert(0, "bf-tools"); from version import dev_image_tag; print(dev_image_tag(sys.argv[1], sys.argv[2]))' "$scm_raw" "$sha")"
          fi

          # bf_image_tag / bf_version / bf_upstream: release identity from git_tag
          # (bf-tools/version.py). Single-line `python -c`, not an indented
          # `<<'PY'` heredoc (YAML indentation would raise IndentationError); the
          # substitution exit is checked explicitly so a malformed git_tag FAILS
          # the build rather than yielding empty tags (a `read < <(python …)` would
          # swallow the failure).
          bf_image_tag=""
          bf_version=""
          bf_upstream=""
          if [ "$CHANNEL" = "release" ]; then
            if [ -z "$GIT_TAG" ]; then
              echo "::error::channel=release requires git_tag (e.g. v0.23.1rc0+bf.0.1.0)." >&2
              exit 1
            fi
            # git_tag is never interpolated into `::error::`: a newline + `::`
            # could smuggle a workflow command. Echo it to stderr as plain text.
            if ! bf_fields="$(python -c 'import sys; sys.path.insert(0, "bf-tools"); from version import parse_git_tag; v = parse_git_tag(sys.argv[1]); print(v.image_tag, v.bf, v.upstream)' "$GIT_TAG")"; then
              printf 'git_tag failed to parse: %q\n' "$GIT_TAG" >&2
              echo "::error::git_tag failed to parse via bf-tools/version.py (expected v<upstream>+bf.<bf>); see the value logged above." >&2
              exit 1
            fi
            read -r bf_image_tag bf_version bf_upstream <<< "$bf_fields"
            # Guard a parse that exits 0 but yields blank fields (would push
            # blank/underscore-only OCI tags).
            if [ -z "$bf_image_tag" ] || [ -z "$bf_version" ] || [ -z "$bf_upstream" ]; then
              echo "::error::release identity is incomplete (image_tag/bf/upstream); refusing to build with blank tags." >&2
              exit 1
            fi
          fi

          {
            echo "channel=${CHANNEL}"
            echo "image=${image}"
            echo "sha=${sha}"
            echo "short=${short}"
            echo "version=${version}"
            echo "scm_version=${scm_version}"
            echo "dev_image_tag=${dev_image_tag}"
            echo "bf_image_tag=${bf_image_tag}"
            echo "bf_version=${bf_version}"
            echo "bf_upstream=${bf_upstream}"
          } >> "$GITHUB_OUTPUT"

      # The build context may be bare upstream, so bf-build-notify is not at the
      # workspace root: sparse-checkout it from the calling ref into bf-actions/.
      - name: Checkout BF composite actions from the calling ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref_name }}
          path: bf-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.prov.outputs.image }}
          # Tag scheme per channel (ADR-0004): see the header.
          tags: |
            type=raw,value=sha-${{ steps.prov.outputs.short }},enable=${{ steps.prov.outputs.channel == 'upstream' }}
            type=raw,value=${{ steps.prov.outputs.version }},enable=${{ steps.prov.outputs.channel == 'upstream' && steps.prov.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.prov.outputs.channel == 'upstream' && github.event.inputs.ref == 'upstream-main' }}
            type=raw,value=${{ steps.prov.outputs.dev_image_tag }},enable=${{ steps.prov.outputs.channel == 'dev' }}
            type=raw,value=${{ steps.prov.outputs.bf_image_tag }},enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=${{ steps.prov.outputs.bf_upstream }}_bf-latest,enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=bf-stable,enable=${{ steps.prov.outputs.channel == 'release' }}
          # Labels per ADR-0004. ai.bf-vllm.build.channel is descriptive on
          # upstream (routing is by repo path), the routing input on dev/release.
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.title=vLLM (Blackfuel, CPU)
            org.opencontainers.image.vendor=Blackfuel
            org.opencontainers.image.version=${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.version || steps.prov.outputs.scm_version) }}
            ai.vllm.image.tag=${{ steps.prov.outputs.version || steps.prov.outputs.bf_upstream }}
            ai.vllm.build.commit=${{ steps.prov.outputs.sha }}
            ai.bf-vllm.build.commit=${{ github.sha }}
            ai.bf-vllm.build.channel=${{ steps.prov.outputs.channel }}
            ai.bf-vllm.bf.version=${{ steps.prov.outputs.bf_version }}
            ai.bf-vllm.scm.version=${{ steps.prov.outputs.scm_version }}

      - name: Build and push CPU image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: docker/Dockerfile.cpu
          # Pin the OpenAI-server stage explicitly. Dockerfile.cpu's last stage
          # is vllm-openai-zen (a derived variant); vllm-openai is the stock-
          # equivalent stage the engine consumes (root, ENTRYPOINT vllm serve).
          target: vllm-openai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cap parallel C++ compile jobs to the runner's vCPU count: the
          # Dockerfile default max_jobs=32 exhausts RAM on this 4vcpu runner
          # (cc1plus Killed, "cannot allocate memory").
          build-args: |
            max_jobs=4

      # Size + STEP_SUMMARY + Slack via the shared bf-build-notify action.
      # always() so a failed build still reports; Slack gated on the token below.
      - name: Report build outcome
        if: always()
        uses: ./bf-actions/.github/actions/bf-build-notify
        with:
          image: ${{ steps.prov.outputs.image }}
          # Best tag for this image by channel: release / dev / upstream / sha pin.
          image-tag: ${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.channel == 'dev' && steps.prov.outputs.dev_image_tag || (steps.prov.outputs.version || format('sha-{0}', steps.prov.outputs.short))) }}
          display-name: vllm-openai-cpu
          summary-title: CPU ${{ steps.prov.outputs.channel }} build
          runner-default: blacksmith-4vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
