# Manually-triggered ROCm image build, pushed to GHCR.
#
# Builds vLLM for AMD/ROCm from `docker/Dockerfile.rocm` against a recent,
# pinned `rocm/vllm-dev` base and publishes to the `upstream` channel
# (ADR-0004): bare upstream vLLM source built with our Dockerfile, no BF
# patch layer beyond the Dockerfile [bf-patch]es themselves.
#
# Caching (ADR-0005, as amended by the sibling Nvidia build PR that adopts
# the local-disk sccache layer): we set USE_SCCACHE=1 with an EMPTY
# SCCACHE_BUCKET_NAME so sccache falls back to its on-disk backend at
# SCCACHE_DIR=/sccache (wired in docker/Dockerfile.rocm). The compiler
# cache itself lives in a BuildKit `type=cache` mount that the Blacksmith
# Docker builder (`useblacksmith/setup-docker-builder`) persists across
# runs on the runner pool's local disk — no S3 bucket, no IAM, no
# cross-region round-trip on every hipcc miss. There is intentionally NO
# `useblacksmith/stickydisk` action and NO SCCACHE_DIR / SCCACHE_CACHE_SIZE
# build-arg: the builder's automatic cache-mount persistence is the
# persistence layer.
#
# Trigger: manual only (workflow_dispatch). ROCm builds are heavy; this is
# not wired to PR/push to avoid burning the runner pool on every change.
#
# Convention: `bf-` filename prefix per ADR-0003 (BF-owns this workflow
# file). Third-party actions are SHA-pinned with their tag in a comment
# per the supply-chain hygiene rule in CLAUDE.md.

name: bf-build-rocm-image-from-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "vLLM source ref to build (branch/tag/sha fetched into the image)"
        required: false
        default: upstream-main

concurrency:
  # One in-flight ROCm build per ref; a newer dispatch cancels the older.
  group: ${{ github.workflow }}-${{ github.event.inputs.upstream_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/blackfuel-ai/bf-vllm/vllm-rocm
  # Pinned by digest for reproducibility. Resolved from the current
  # upstream default tag `rocm/vllm-dev:base` (linux/amd64, ROCm at
  # /opt/rocm, PYTORCH_ROCM_ARCH includes gfx942/gfx950 = MI300/MI325),
  # created 2026-06-10 — far newer than the fork's stale
  # `vllm/vllm-openai-rocm:base-nightly-e80e633927ab...` pin. Verified to
  # pull (HTTP 200, ~9.9 GB). Refresh by re-resolving the tag's digest.
  BASE_IMAGE: rocm/vllm-dev@sha256:251f19b4a8ac67b575e48dda34c5b0c5a0f400c55d919601c9c08eab9fd2868a

jobs:
  build-rocm:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # ROCm/HIP compile surface is large; a cold build is long. Cap well
    # under GitHub's 360 min hard kill while leaving room for a cold run.
    timeout-minutes: 300
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Calling-ref handling (the ROCm analogue of nvidia's overlay-from-calling
      # -ref pattern): no `ref:` here, so checkout defaults to github.ref — the
      # branch this workflow was dispatched on (main by default, or a feature
      # branch via `gh workflow run --ref <branch>`). The build below uses
      # `file: docker/Dockerfile.rocm` straight from THIS checkout, so a
      # [bf-patch] to Dockerfile.rocm is exercised through the real from-upstream
      # pipeline pre-merge. nvidia needs a second sparse checkout to overlay its
      # Dockerfile because its CUDA Dockerfile ingests the vLLM *source* as the
      # build context (COPY . ./); ROCm's Dockerfile.rocm instead clones vLLM
      # source inside the build (VLLM_REPO/VLLM_BRANCH below), so the build
      # context stays the bf-vllm checkout and no overlay step is required.
      - name: Checkout bf-vllm
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # upstream-main is a local branch on this fetch; we read its HEAD below
          # to resolve the concrete vLLM commit. Full history not needed — just
          # the upstream-main ref.
          fetch-depth: 0

      # Resolve upstream_ref to a concrete vLLM commit SHA.
      #
      # `upstream-main` is a *bf-vllm* branch (the fast-forward mirror of
      # vllm-project/vllm:main, ADR-0002) — it does NOT exist on vLLM's repo, so
      # the Dockerfile's `git clone vllm-project/vllm && git fetch origin
      # upstream-main` cannot fetch it. Resolve it to the bf-vllm mirror's HEAD
      # SHA, which IS a real vLLM commit and is fetchable from vLLM by full SHA
      # (GitHub allowAnySHA1InWant). Any other ref (a vLLM tag/branch/sha) is
      # passed through unchanged.
      #
      # The resolved SHA is what we both build (VLLM_BRANCH) and tag/label with,
      # so the `:upstream-<sha>` tag identifies the actual vLLM source — matching
      # the cpu/nvidia from-upstream workflows. Previously this tagged with
      # github.sha (the bf-vllm Dockerfile commit), which is the wrong commit.
      - name: Resolve upstream provenance
        id: prov
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          vllm_repo="https://github.com/vllm-project/vllm.git"
          if [ "$UPSTREAM_REF" = "upstream-main" ]; then
            git fetch --depth 1 origin upstream-main
            upstream_sha="$(git rev-parse FETCH_HEAD)"
          else
            upstream_sha="$UPSTREAM_REF"
          fi
          # Fail fast here (seconds) rather than deep in the multi-hour ROCm
          # Dockerfile build: prove the resolved ref is actually fetchable from
          # vLLM before the build starts. Two cases, both verified over the
          # network so a typo cannot slip through:
          #   - full 40-hex SHA: not necessarily a ref tip, so ls-remote can't
          #     see it; do a real shallow `git fetch <repo> <sha>` (GitHub serves
          #     arbitrary commits via allowAnySHA1InWant). A bogus SHA fails here.
          #   - anything else (tag/branch): must resolve via `git ls-remote`.
          if printf '%s' "$upstream_sha" | grep -Eqx '[0-9a-f]{40}'; then
            if git fetch --depth 1 "$vllm_repo" "$upstream_sha" >/dev/null 2>&1; then
              echo "upstream_sha '$upstream_sha' is fetchable from $vllm_repo."
            else
              echo "::error::upstream_ref '$UPSTREAM_REF' looks like a SHA but is not fetchable from $vllm_repo. Pass a real vLLM commit, a tag/branch, or 'upstream-main'." >&2
              exit 1
            fi
          elif git ls-remote --exit-code "$vllm_repo" "$upstream_sha" >/dev/null 2>&1; then
            echo "upstream_sha '$upstream_sha' resolves on $vllm_repo."
          else
            echo "::error::upstream_ref '$UPSTREAM_REF' (resolved '$upstream_sha') does not resolve as a tag/branch on $vllm_repo. Pass a valid vLLM ref or 'upstream-main'." >&2
            exit 1
          fi
          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_short=${upstream_sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      # Blacksmith-native Docker builder: persists BuildKit `type=cache`
      # mounts (our /sccache) across runs on the runner pool's local disk.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          # `upstream` channel tags per ADR-0004: immutable per-commit tag
          # always; the shared moving `:upstream-latest` only when building
          # the canonical upstream-main ref, so a manual dispatch of some
          # other ref can't silently clobber it.
          tags: |
            type=raw,value=upstream-${{ steps.prov.outputs.upstream_short }}
            type=raw,value=upstream-latest,enable=${{ github.event.inputs.upstream_ref == 'upstream-main' }}
          # OCI + bf-vllm channel labels per ADR-0004 §8b. channel=upstream.
          # image.revision / ai.bf-vllm.build.commit = the bf-vllm Dockerfile
          # commit (github.sha); ai.vllm.build.commit = the upstream vLLM commit
          # actually built.
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=upstream-${{ steps.prov.outputs.upstream_short }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.title=vLLM (Blackfuel, ROCm)
            org.opencontainers.image.vendor=Blackfuel
            ai.bf-vllm.build.channel=upstream
            ai.bf-vllm.build.commit=${{ github.sha }}
            ai.vllm.build.commit=${{ steps.prov.outputs.upstream_sha }}

      # Cache-aware builder. USE_SCCACHE=1 + empty SCCACHE_BUCKET_NAME =
      # local-disk sccache backend (see header). No bucket/region/creds
      # build-args: that is the S3 path we deliberately do not take here.
      - name: Build and push ROCm image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: docker/Dockerfile.rocm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            VLLM_REPO=https://github.com/vllm-project/vllm.git
            # Resolved concrete vLLM commit, not the raw upstream_ref: the
            # Dockerfile clones vllm-project/vllm and fetches this ref, and
            # `upstream-main` is a bf-vllm branch that does not exist there.
            VLLM_BRANCH=${{ steps.prov.outputs.upstream_sha }}
            USE_SCCACHE=1
            SCCACHE_BUCKET_NAME=

      # Measure pushed image size, write the STEP_SUMMARY metrics table, and
      # post a Block Kit build summary to Slack — all in one shared composite
      # action (.github/actions/bf-build-notify). always() so a failed build
      # still reports; fails closed to '—'. Slack is gated on the token below.
      - name: Report build outcome
        if: always()
        uses: ./.github/actions/bf-build-notify
        with:
          image: ${{ env.IMAGE }}
          tag: upstream-${{ steps.prov.outputs.upstream_short }}
          display-name: vllm-rocm
          summary-title: ROCm from-upstream build
          arch-list: gfx942 gfx950
          runner-default: blacksmith-16vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
