# Manually-triggered NVIDIA/CUDA image build, channel-aware (ADR-0004). The
# CUDA Dockerfile ingests the vLLM *source* as its build context (COPY . ./), so
# source is checked into src/. The `channel` input selects the registry repo,
# tag scheme, OCI labels, and built source:
#   upstream  bare upstream vLLM in src/, with BF's docker/Dockerfile overlaid
#             from the calling ref (so the image carries the BF Dockerfile —
#             sccache [bf-patch], arch-trim — over bare upstream source). Repo
#             path IS the channel signal:
#               ghcr.io/blackfuel-ai/bf-vllm/upstream/vllm-openai:sha-<short>
#               …:vX.Y.Z (upstream release tags); …:latest (upstream-main only)
#   dev       bf-vllm tree in src/ as-is (no overlay), shared repo, label-routed:
#               …/vllm-openai:<base-version>-dev-<sha7>
#   release   bf-vllm tree at the release ref, via bf-release.yml's git_tag:
#               …/vllm-openai:<upstream>_bf.<bf>  +  :<upstream>_bf-latest  +  :bf-stable
#
# Caching (ADR-0005 amendment): sccache local-disk mode (USE_SCCACHE=1 + empty
# SCCACHE_BUCKET_NAME) writes into /sccache, a BuildKit `type=cache` mount the
# Blacksmith builder persists across runs — the cache mount IS the persistence
# layer, no S3. VLLM_USE_PRECOMPILED is intentionally OFF (these moving refs
# would stale the wheel and recompile anyway); do not flip it without re-reading
# ADR-0005.

name: bf-build-nvidia-image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel (ADR-0004): upstream (bare upstream), dev (bf-vllm tree, preview), release (bf-vllm tree at a release tag)."
        type: choice
        required: true
        default: upstream
        options:
          - upstream
          - dev
          - release
      ref:
        description: "Source ref to build. upstream: a vLLM ref (branch/tag/SHA) or upstream-main. dev/release: a bf-vllm ref (branch/SHA/tag)."
        type: string
        required: true
        default: upstream-main
      git_tag:
        description: "Release git tag (release channel only), e.g. v0.23.1rc0+bf.0.1.0. Mapped to the OCI image tag via bf-tools/version.py."
        type: string
        required: false
        default: ""
      arch_list:
        description: "CUDA arch list to compile (torch_cuda_arch_list). Default '9.0 10.0' = Hopper (H100/H200) + Blackwell (B200/B300), the Blackfuel production GPUs. Add 8.9 to also serve Ada/L40S in the same image."
        type: string
        required: false
        default: "9.0 10.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: bf-build-nvidia-${{ github.event.inputs.channel }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 32 vCPU / 360 min sized for the cold build: the untrimmed cold compile
    # exceeds the cap on 16 vCPU; 32 vCPU halves the wall-clock. One-time warm-up
    # cost — warm builds hit the ADR-0005 ~25 min target.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 + tags so the dev channel can `git describe` the tree.
      - name: Checkout source at ref (build context)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          path: src

      - name: Resolve channel, image repository, and provenance
        id: prov
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          REF: ${{ github.event.inputs.ref }}
          GIT_TAG: ${{ github.event.inputs.git_tag }}
          ARCH_LIST: ${{ github.event.inputs.arch_list }}
          OWNER_IMAGE: ghcr.io/blackfuel-ai/bf-vllm
        run: |
          set -euo pipefail
          # arch_list reaches the Docker build-arg, so reject anything but
          # space-separated CUDA tokens before it gets there (injection guard).
          if ! printf '%s' "$ARCH_LIST" | grep -Eqx '([0-9]+\.[0-9]+[a-z]?(\+PTX)?)( [0-9]+\.[0-9]+[a-z]?(\+PTX)?)*'; then
            printf 'rejected arch_list: %q\n' "$ARCH_LIST" >&2
            echo "::error::arch_list is not a space-separated CUDA arch list (e.g. '8.9 9.0 10.0'); see the value logged above." >&2
            exit 1
          fi
          # Source lives under src/, so git queries against it need -C src.
          sha="$(git -C src rev-parse HEAD)"
          short="${sha:0:7}"

          # version: set only when the ref is an upstream release tag — then the
          # upstream channel publishes :vX.Y.Z; empty otherwise.
          if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            version="$REF"
          else
            version=""
          fi

          case "$CHANNEL" in
            upstream)
              # upstream channel = dedicated repo (path is the channel signal,
              # ADR-0004). NVIDIA is the unsuffixed vllm-openai repo; the other
              # arches carry an accel suffix (vllm-openai-rocm, …).
              image="${OWNER_IMAGE}/upstream/vllm-openai"
              ;;
            dev|release)
              image="${OWNER_IMAGE}/vllm-openai"
              ;;
            *)
              echo "::error::Unknown channel '${CHANNEL}'." >&2
              exit 1
              ;;
          esac

          # scm_version: the tree's git-describe self-name (BF release line, else
          # upstream tag line), `+`->`_` for OCI. The fallback always resolves.
          scm_raw="$(git -C src describe --tags --match 'v*+bf.*' HEAD 2>/dev/null \
                  || git -C src describe --tags --match 'v[0-9]*' HEAD)"
          scm_version="${scm_raw//+/_}"

          # dev tag <base>-dev-<sha7>, formatted by version.py (single source).
          dev_image_tag=""
          if [ "$CHANNEL" = "dev" ]; then
            dev_image_tag="$(python -c 'import sys; sys.path.insert(0, "src/bf-tools"); from version import dev_image_tag; print(dev_image_tag(sys.argv[1], sys.argv[2]))' "$scm_raw" "$sha")"
          fi

          # Release identity from git_tag via version.py. Single-line `python -c`
          # (an indented `<<'PY'` heredoc would raise IndentationError); explicit
          # exit check so a bad git_tag fails loudly instead of yielding empty
          # tags (a `read < <(python …)` swallows the substituted exit).
          bf_image_tag=""
          bf_version=""
          bf_upstream=""
          if [ "$CHANNEL" = "release" ]; then
            if [ -z "$GIT_TAG" ]; then
              echo "::error::channel=release requires git_tag (e.g. v0.23.1rc0+bf.0.1.0)." >&2
              exit 1
            fi
            # git_tag is never interpolated into `::error::` (a newline + `::`
            # could smuggle a workflow command); logged via %q instead.
            if ! bf_fields="$(python -c 'import sys; sys.path.insert(0, "src/bf-tools"); from version import parse_git_tag; v = parse_git_tag(sys.argv[1]); print(v.image_tag, v.bf, v.upstream)' "$GIT_TAG")"; then
              printf 'git_tag failed to parse: %q\n' "$GIT_TAG" >&2
              echo "::error::git_tag failed to parse via bf-tools/version.py (expected v<upstream>+bf.<bf>); see the value logged above." >&2
              exit 1
            fi
            read -r bf_image_tag bf_version bf_upstream <<< "$bf_fields"
            # Refuse blank fields (parse exited 0 but yielded nothing) — else the
            # build would push blank/underscore-only tags.
            if [ -z "$bf_image_tag" ] || [ -z "$bf_version" ] || [ -z "$bf_upstream" ]; then
              echo "::error::release identity is incomplete (image_tag/bf/upstream); refusing to build with blank tags." >&2
              exit 1
            fi
          fi

          {
            echo "channel=${CHANNEL}"
            echo "image=${image}"
            echo "sha=${sha}"
            echo "short=${short}"
            echo "version=${version}"
            echo "scm_version=${scm_version}"
            echo "dev_image_tag=${dev_image_tag}"
            echo "bf_image_tag=${bf_image_tag}"
            echo "bf_version=${bf_version}"
            echo "bf_upstream=${bf_upstream}"
          } >> "$GITHUB_OUTPUT"

      # upstream only: overlay BF's docker/Dockerfile onto the bare upstream
      # source. dev/release src/ is the bf-vllm tree, which already has it.
      - name: Overlay BF docker/Dockerfile from the calling ref
        if: ${{ steps.prov.outputs.channel == 'upstream' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}
          path: bf
          sparse-checkout: docker/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Stage overlaid Dockerfile into the upstream context
        if: ${{ steps.prov.outputs.channel == 'upstream' }}
        run: cp bf/docker/Dockerfile src/docker/Dockerfile

      # src/ holds the build source, not the workspace root, so sparse-checkout
      # the composite action into bf-actions/ for the `uses:` below.
      - name: Checkout BF composite actions from the calling ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}
          path: bf-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.prov.outputs.image }}
          # Tags per channel (ADR-0004): upstream → :sha-<short> / :vX.Y.Z /
          # :latest (upstream-main); dev → :<base>-dev-<sha7>; release →
          # immutable :<bf-image-tag> + moving :<upstream>_bf-latest / :bf-stable.
          tags: |
            type=raw,value=sha-${{ steps.prov.outputs.short }},enable=${{ steps.prov.outputs.channel == 'upstream' }}
            type=raw,value=${{ steps.prov.outputs.version }},enable=${{ steps.prov.outputs.channel == 'upstream' && steps.prov.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.prov.outputs.channel == 'upstream' && github.event.inputs.ref == 'upstream-main' }}
            type=raw,value=${{ steps.prov.outputs.dev_image_tag }},enable=${{ steps.prov.outputs.channel == 'dev' }}
            type=raw,value=${{ steps.prov.outputs.bf_image_tag }},enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=${{ steps.prov.outputs.bf_upstream }}_bf-latest,enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=bf-stable,enable=${{ steps.prov.outputs.channel == 'release' }}
          # ai.vllm.* keep upstream semantics (build.commit = the vLLM source
          # built); ai.bf-vllm.* hold BF provenance. image.tag = the upstream
          # tag (ADR-0004), bf.version on release only.
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.title=vLLM (Blackfuel, Nvidia)
            org.opencontainers.image.vendor=Blackfuel
            org.opencontainers.image.version=${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.version || steps.prov.outputs.scm_version) }}
            ai.vllm.image.tag=${{ steps.prov.outputs.version || steps.prov.outputs.bf_upstream }}
            ai.vllm.build.commit=${{ steps.prov.outputs.sha }}
            ai.bf-vllm.build.commit=${{ github.sha }}
            ai.bf-vllm.build.channel=${{ steps.prov.outputs.channel }}
            ai.bf-vllm.bf.version=${{ steps.prov.outputs.bf_version }}
            ai.bf-vllm.scm.version=${{ steps.prov.outputs.scm_version }}

      - name: Build and push NVIDIA image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: src
          file: src/docker/Dockerfile
          # Pin the OpenAI-server stage explicitly. docker/Dockerfile's last
          # stage is vllm-openai-nonroot (opt-in, USER vllm, WORKDIR /home/vllm);
          # with no target buildx would build that last stage, so the published
          # image would run non-root with a moved CWD. The engine consumes this
          # as stock vllm/vllm-openai: root, WORKDIR /vllm-workspace, where
          # relative args like --chat-template examples/... resolve. vllm-openai
          # is that stock-equivalent stage.
          target: vllm-openai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # USE_SCCACHE=1 + empty SCCACHE_BUCKET_NAME = local-disk sccache (the
          # Blacksmith BuildKit cache mount persists it; no S3), ADR-0005.
          # arch_list trims upstream's 8-arch default to what we run — each arch
          # is a full nvcc pass and the untrimmed cold build exceeds the cap.
          build-args: |
            USE_SCCACHE=1
            SCCACHE_BUCKET_NAME=
            torch_cuda_arch_list=${{ github.event.inputs.arch_list }}

      - name: Report build outcome
        if: always()
        uses: ./bf-actions/.github/actions/bf-build-notify
        with:
          image: ${{ steps.prov.outputs.image }}
          image-tag: ${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.channel == 'dev' && steps.prov.outputs.dev_image_tag || (steps.prov.outputs.version || format('sha-{0}', steps.prov.outputs.short))) }}
          display-name: vllm-nvidia
          summary-title: NVIDIA ${{ steps.prov.outputs.channel }} build
          arch-list: ${{ github.event.inputs.arch_list }}
          runner-default: blacksmith-32vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
