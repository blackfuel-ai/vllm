# Manually-triggered NVIDIA/CUDA image build from bare-upstream vLLM.
#
# Produces the `upstream` channel (ADR-0004): our docker/Dockerfile built
# against upstream's vLLM source at `upstream_ref`, no Blackfuel patch
# layer. Pushed to GHCR as the vllm-nvidia image.
#
# Caching strategy (ADR-0005 amendment): sccache (the compiler cache) runs
# in local-disk mode, writing into /sccache inside the build. That path is
# a BuildKit `type=cache` mount (id vllm-nvidia-sccache) declared in
# docker/Dockerfile, and the Blacksmith Docker builder persists BuildKit
# cache mounts across runs automatically — so warm builds reuse compiled
# object output. No S3, no external bucket, no separate sticky-disk action:
# the cache mount IS the persistence layer. The local-disk sccache path is
# selected by passing USE_SCCACHE=1 with an empty SCCACHE_BUCKET_NAME (see
# the [bf-patch] "enable local-disk sccache via BuildKit cache mount").
#
# VLLM_USE_PRECOMPILED is intentionally left OFF here. Precompiled wheels
# speed up Python-only changes by skipping the C++/CUDA compile, but the
# from-upstream channel is patch-free and tracks upstream HEAD, where the
# wheel would frequently be stale and trigger a full recompile anyway.
# sccache gives the speedup instead — it caches at the compiler-invocation
# level, so even a moving upstream HEAD reuses most object output. Do not
# flip VLLM_USE_PRECOMPILED on without re-reading ADR-0005.

name: bf-build-nvidia-image-from-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref (branch, tag, or SHA) to build"
        required: true
        default: upstream-main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.upstream_ref }}
  cancel-in-progress: true

env:
  # upstream channel = its own repository (ADR-0004 amendment 2026-06-22).
  # The registry path is the channel signal, so tags are bare and
  # vLLM-identical; the engine recognises an upstream image by this path and
  # the production pool never points here.
  IMAGE: ghcr.io/blackfuel-ai/bf-vllm/upstream/vllm-nvidia

jobs:
  build:
    # 32 vCPU + 360 min cap, sized for the first COLD build (empty sccache, no
    # hits until one build completes to warm /sccache). The cold compile is
    # ~417 CUDA objects; the heavy vllm-flash-attn SM90 kernels run ~49s each
    # even on 16 vCPU, so a cold 16-vCPU build still exceeds the 300 min cap
    # (8 vCPU reached 91%, 16 vCPU ~66% at 3h then projected to time out). 32
    # vCPU roughly halves the compile wall-clock and 360 (GitHub's max) leaves
    # headroom for link + wheel finalize + the multi-GB image push. Once this
    # build warms /sccache, warm builds hit the ADR-0005 ~25 min target and the
    # runner can be dropped back; 32 vCPU is the one-time warm-up cost.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The build context is upstream source at upstream_ref (CUDA Dockerfile
      # ingests source via COPY . ./ADD . — source IS the context). We then
      # overlay BF's docker/Dockerfile from main on top, so the compiled
      # Dockerfile carries the local-disk sccache [bf-patch] (SCCACHE_DIR +
      # /sccache cache mount + bucket-gated S3) while the vLLM source stays
      # bare upstream. This mirrors how the ROCm channel already builds main's
      # Dockerfile.rocm against upstream source — kept consistent across arches.
      - name: Checkout upstream source (build context)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0
          path: src

      - name: Resolve build provenance
        id: rev
        # `sha-<short>` is the immutable per-build pin (label carries the full
        # SHA). `version` is the bare vLLM-identical name, set only when the
        # built ref is an upstream release tag (vX.Y.Z[rcN]) — then we publish
        # `:vX.Y.Z` exactly as vLLM names it. A between-tags build (upstream-main
        # or a bare sha) has no release name, so `version` is empty and only the
        # sha pin (+ `:latest` for upstream-main) is published. Matches the
        # cpu/rocm from-upstream workflows so all arches tag identically.
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse HEAD)"
          if printf '%s' "$UPSTREAM_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            version="$UPSTREAM_REF"
          else
            version=""
          fi
          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_short=${upstream_sha:0:7}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
        working-directory: src

      # Overlay BF's docker/Dockerfile from the ref this workflow was dispatched
      # on (github.ref_name) — main by default, or a feature branch when run via
      # `gh workflow run --ref <branch>`. This lets a docker/Dockerfile change be
      # tested through the real from-upstream pipeline before merge, the way any
      # other GitHub Action runs against its calling branch. The vLLM *source*
      # still comes from upstream_ref (the checkout above) — only the Dockerfile
      # tracks the calling branch.
      - name: Overlay BF docker/Dockerfile from the calling ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}
          path: bf
          sparse-checkout: docker/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Stage patched Dockerfile into the upstream context
        run: cp bf/docker/Dockerfile src/docker/Dockerfile

      # The build context above is bare upstream vLLM source, so the
      # bf-build-notify composite action is not present at the workspace root.
      # Sparse-checkout just .github/actions from the calling bf-vllm ref into
      # bf-actions/ so `uses: ./bf-actions/...` below resolves — the same path
      # the cpu/cpu-bench/rocm builds use, so all four reference one action path.
      - name: Checkout BF composite actions from the calling ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}
          path: bf-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          # Bare, vLLM-identical tags in the dedicated upstream repository:
          #   :sha-<short>  immutable per-build pin (always).
          #   :vX.Y.Z       the release name, only when building an upstream
          #                 release tag (steps.rev version non-empty).
          #   :latest       the moving tag, only when building the canonical
          #                 upstream-main ref — any other ref must not clobber it.
          tags: |
            type=raw,value=sha-${{ steps.rev.outputs.upstream_short }}
            type=raw,value=${{ steps.rev.outputs.version }},enable=${{ steps.rev.outputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.upstream_ref == 'upstream-main' }}
          # ai.bf-vllm.build.channel stays as descriptive provenance — engine
          # routing for the upstream channel is by repository path, not this
          # label (ADR-0004 amendment).
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.version || format('sha-{0}', steps.rev.outputs.upstream_short) }}
            ai.vllm.image.tag=${{ steps.rev.outputs.version }}
            ai.bf-vllm.build.channel=upstream
            ai.vllm.build.commit=${{ steps.rev.outputs.upstream_sha }}

      - name: Build and push NVIDIA image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          # context = upstream source at upstream_ref, with main's patched
          # docker/Dockerfile overlaid (see the checkout steps above).
          context: src
          file: src/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # USE_SCCACHE=1 with an empty SCCACHE_BUCKET_NAME selects the local-disk
          # sccache backend in the overlaid Dockerfile: the S3 vars are gated on a
          # non-empty bucket, so an empty bucket leaves only SCCACHE_DIR=/sccache,
          # persisted across runs by the Blacksmith BuildKit cache mount
          # (ADR-0005 amendment). No S3 bucket in this channel.
          #
          # torch_cuda_arch_list overrides the upstream Dockerfile default
          # ('7.5 8.0 8.6 8.9 9.0 10.0 11.0 12.0+PTX') down to the hardware
          # Blackfuel actually runs — Hopper (9.0: H100/H200) and Blackwell
          # (10.0: B200/B300). This is ADR-0005 lever #2 (arch-list trim): each
          # extra CUDA arch is a full nvcc pass, and the untrimmed list compiles
          # ~452 CUDA objects in the csrc wheel — a cold build does not finish
          # inside the runner limit. Trimming to 2 arches cuts that ~25-40%.
          build-args: |
            USE_SCCACHE=1
            SCCACHE_BUCKET_NAME=
            torch_cuda_arch_list=9.0 10.0

      # Measure pushed image size, write the STEP_SUMMARY metrics table, and
      # post a Block Kit build summary to Slack — all in one shared composite
      # action (.github/actions/bf-build-notify). always() so a failed build
      # still reports; fails closed to '—'. Slack is gated on the token below.
      - name: Report build outcome
        if: always()
        uses: ./bf-actions/.github/actions/bf-build-notify
        with:
          image: ${{ env.IMAGE }}
          # The version name when we built a release tag, else the sha pin —
          # whichever image tag identifies this image best (used to measure size
          # and shown in the summary/Slack).
          image-tag: ${{ steps.rev.outputs.version || format('sha-{0}', steps.rev.outputs.upstream_short) }}
          display-name: vllm-nvidia
          summary-title: NVIDIA from-upstream build
          arch-list: 9.0a 10.0a
          runner-default: blacksmith-32vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
