# bf-vllm release orchestration (manual, workflow_dispatch only).
#
# Cuts a Blackfuel release per ADR-0004: a single canonical version
#   v<upstream-semver>+bf.<bf-semver>   (e.g. v0.20.2+bf.0.1.0)
# tagged on `main`, with a matching GitHub release and (in a later PR) the
# `release`-channel arch images on GHCR.
#
# Release model (ADR-0002 §Decision): we tag `main` DIRECTLY. Release
# branches are OPTIONAL — created only for hotfix isolation of an old
# upstream line (`release/v<upstream>+bf.<bf>.x`), NOT on the normal release
# path. `main` is never force-pushed, so tags on it are stable forever; there
# is no rebase, no `bf/patches` branch, no upstream-tag + BF-layer re-merge.
# (The master plan §8c was written in an earlier rebase-era design and
# describes building a release branch by merging the BF layer onto the
# upstream tag; ADR-0002's merge model supersedes that — `main` already IS
# upstream-merged + the BF layer, so we tag the chosen point on `main`.)
#
# What this workflow does:
#   1. Validate inputs — bf_version shape via bf-tools/version.py; resolve
#      upstream_tag -> SHA and confirm it is an ancestor of upstream-main;
#      confirm bf_version is a legal increment over the latest release; confirm
#      the upstream tag commit is reachable from the release ref on main.
#   2. Resolve the release ref on `main` (default: current main HEAD).
#   3. Run the curated CI (the bf-precommit suite) on the release ref.
#   4. Dispatch the per-arch `release`-channel image builds — an explicit
#      matrix (the dispatch-builds job) with one row per target
#      (nvidia/rocm/cpu/cpu-bench), each carrying its own build workflow and,
#      for nvidia, the CUDA arch list. image_targets subsets which rows fire.
#   5. Create the annotated git tag v<upstream>+bf.<bf> (via version.py) and
#      push it with the bf-vllm-sync App token.
#   6. Generate the release notes (bf-tools/generate-release-notes.py) and
#      create the GitHub release pointing at the tag.
#   7. Notify #bf-vllm-releases on Slack (guarded — the webhook is a later
#      operator prereq; the step is skipped while the secret is unset).
#
# A real run creates a real git tag and a real GitHub release. It is an
# operator-gated action; do not dispatch it as part of CI.

name: bf-release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream vLLM tag this release is based on (e.g. v0.23.1 or v0.23.1rc0). Leave blank to auto-derive the newest release tag reachable from the release ref. Override only to pin a specific base."
        type: string
        required: false
        default: ""
      bf_version:
        description: "Blackfuel layer SemVer (e.g. 0.1.0). Leave blank to auto-suggest the next patch over the latest release on this line (or 0.1.0 for the first). Set explicitly for a minor/major bump."
        type: string
        required: false
        default: ""
      image_targets:
        description: "Comma-separated arch image targets for the release-channel builds."
        type: string
        required: false
        default: nvidia,rocm,cpu,cpu-bench

# Only one release in flight at a time; never cancel a release mid-tag.
concurrency:
  group: bf-release
  cancel-in-progress: false

# Default GITHUB_TOKEN is read-only here: the tag push and release creation
# use the separately-minted bf-vllm-sync App token (whose access is governed
# by the App installation), mirroring bf-sync-upstream.
permissions:
  contents: read

env:
  # Slack via the shared org bot token + chat.postMessage Block Kit, the same
  # mechanism bf-sync-upstream and the bf-build-notify action use (one
  # convention across the platform — not the old per-workflow incoming-webhook).
  # Surfaced into env so the optional notify step can gate on it (the `secrets`
  # context is not allowed in a step `if:`); empty when unset, which skips the
  # step. Channel #bot-bf-vllm-releases; the bot must be a member of it.
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: C0BC8MS3SP4

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Surface the resolved release identity to the dispatch-builds job below.
    outputs:
      git_tag: ${{ steps.resolve.outputs.git_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Mint bf-vllm-sync App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id is the non-deprecated identifier (app-id is deprecated).
          # The bf-vllm-sync App's Client ID; its installation governs the
          # effective push/release access.
          client-id: Iv23liG4vLDpTNkt8CLs
          private-key: ${{ secrets.BF_VLLM_SYNC_PRIVATE_KEY }}

      - name: Checkout main (full history + tags)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # The release tag push uses the App token, so persist it as the
          # checkout credential.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity (bf-vllm-sync bot)
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Set up Python
        # v6.1.0 matches bf-precommit.yml and has 3.14 in its version manifest;
        # allow-prereleases keeps the resolve robust if only a 3.14 RC is indexed
        # on the runner image.
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Validate inputs and resolve the release version
        id: resolve
        env:
          UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag }}
          BF_VERSION: ${{ github.event.inputs.bf_version }}
        run: |
          set -euo pipefail

          # --- fetch the upstream-main mirror so ancestry checks are local.
          git fetch origin upstream-main:upstream-main
          git fetch --tags origin

          RELEASE_REF="$(git rev-parse main)"

          # --- auto-derive upstream_tag when blank: the newest release tag
          # (vX.Y.Z[rcN]) reachable from the release ref. main's upstream layer
          # IS a release tag by construction (ADR-0002 tag-gated merge), so this
          # is exactly the upstream this release is based on. An rc is allowed
          # here: the bf-release path may deliberately release the temporary rc
          # main currently sits on. (The bf-sync-upstream automation stays
          # finals-only — it will not auto-track rc's; only a human release may.)
          if [ -z "${UPSTREAM_TAG}" ]; then
            UPSTREAM_TAG="$(
              git tag --list 'v*' --merged "$RELEASE_REF" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$' \
                | sort -V | tail -n1
            )"
            if [ -z "${UPSTREAM_TAG}" ]; then
              echo "::error::Could not auto-derive an upstream tag reachable from main. Pass upstream_tag explicitly."
              exit 1
            fi
            echo "Auto-derived upstream_tag=${UPSTREAM_TAG} (newest release tag reachable from main)."
          fi

          # --- auto-suggest bf_version when blank: next PATCH over the latest
          # release on this upstream line, or 0.1.0 for the first release. The
          # operator sets it explicitly for a minor/major bump.
          if [ -z "${BF_VERSION}" ]; then
            LATEST_BF_TAG="$(git tag --list "${UPSTREAM_TAG}+bf.*" | sort -V | tail -n1)"
            if [ -z "${LATEST_BF_TAG}" ]; then
              BF_VERSION="0.1.0"
            else
              BF_VERSION="$(python -c '
          import sys; sys.path.insert(0, "bf-tools")
          from version import parse_git_tag
          maj, minr, pat = (int(x) for x in parse_git_tag(sys.argv[1]).bf.split("."))
          print(f"{maj}.{minr}.{pat + 1}")' "$LATEST_BF_TAG")"
            fi
            echo "Auto-suggested bf_version=${BF_VERSION} (next patch; set explicitly for minor/major)."
          fi

          # --- compute the canonical git tag and validate its SHAPE through the
          # single source of truth (bf-tools/version.py). A malformed bf_version
          # (or upstream_tag missing its leading v) fails here, loudly.
          GIT_TAG="${UPSTREAM_TAG}+bf.${BF_VERSION}"
          python - "$GIT_TAG" <<'PY'
          import sys
          sys.path.insert(0, "bf-tools")
          from version import parse_git_tag
          v = parse_git_tag(sys.argv[1])
          print(f"validated {v.git_tag} -> image {v.image_tag}")
          PY
          echo "git_tag=${GIT_TAG}" >> "$GITHUB_OUTPUT"
          IMAGE_TAG="$(python -c 'import sys; sys.path.insert(0,"bf-tools"); from version import to_image_tag; print(to_image_tag(sys.argv[1]))' "$GIT_TAG")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          # Surface the resolved (possibly auto-derived) upstream tag and the BF
          # SemVer so the Slack card can field them without re-deriving — the
          # workflow inputs may be blank when auto-derived.
          {
            echo "upstream_tag=${UPSTREAM_TAG}"
            echo "bf_version=${BF_VERSION}"
          } >> "$GITHUB_OUTPUT"

          # --- the release tag must not already exist (no clobbering a release).
          if git rev-parse -q --verify "refs/tags/${GIT_TAG}" >/dev/null; then
            echo "::error::Tag ${GIT_TAG} already exists — releases are immutable."
            exit 1
          fi

          # --- resolve upstream_tag -> SHA and confirm it is an ancestor of
          # upstream-main (i.e. a tag genuinely mirrored on our upstream line).
          if ! git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}^{commit}" >/dev/null; then
            echo "::error::Upstream tag ${UPSTREAM_TAG} is not present. Has the sync mirrored it onto upstream-main yet?"
            exit 1
          fi
          UPSTREAM_SHA="$(git rev-parse "refs/tags/${UPSTREAM_TAG}^{commit}")"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" upstream-main; then
            echo "::error::${UPSTREAM_TAG} ($UPSTREAM_SHA) is not an ancestor of upstream-main."
            exit 1
          fi

          # --- the release point on main must already contain that upstream tag
          # (the daily sync merges upstream-main into main; ADR-0002). If main
          # has not yet synced past this upstream tag, the BF release would not
          # actually contain it — fail rather than tag a misleading version.
          # RELEASE_REF was resolved above (main HEAD) before input derivation.
          echo "release_ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "$RELEASE_REF"; then
            echo "::error::main ($RELEASE_REF) has not yet merged upstream ${UPSTREAM_TAG}. Run the sync first."
            exit 1
          fi

          # --- bf_version must be a legal increment over the latest release on
          # this upstream line. "Latest" = highest bf semver among tags
          # v<upstream_tag>+bf.* (independent per upstream line, ADR-0004). The
          # new bf_version must sort strictly greater; the first release on a
          # line has no predecessor and is always legal.
          PREV_TAG="$(
            git tag --list "${UPSTREAM_TAG}+bf.*" \
              | sort -V | tail -n1
          )"
          if [ -n "$PREV_TAG" ]; then
            python - "$PREV_TAG" "$GIT_TAG" <<'PY'
          import sys
          sys.path.insert(0, "bf-tools")
          from version import parse_git_tag

          prev = parse_git_tag(sys.argv[1])
          new = parse_git_tag(sys.argv[2])
          to_t = lambda s: tuple(int(x) for x in s.split("."))
          if to_t(new.bf) <= to_t(prev.bf):
              sys.exit(
                  f"bf_version {new.bf} is not a strict increment over "
                  f"the latest release {prev.git_tag} (bf {prev.bf})."
              )
          print(f"bf {new.bf} is a legal increment over {prev.bf}")
          PY
          else
            echo "No prior release on the ${UPSTREAM_TAG} line — first release, accepted."
          fi
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Changelog floor: the previous bf release if there is one, else the
          # upstream tag this release is based on. For a FIRST release, falling
          # back to the upstream tag scopes the notes to the BF layer on top of
          # upstream (v<upstream>..main) rather than the entire vLLM history —
          # the latter blows past GitHub's 125k-char release-body limit (422).
          NOTES_FLOOR="${PREV_TAG:-${UPSTREAM_TAG}}"
          echo "notes_floor=${NOTES_FLOOR}" >> "$GITHUB_OUTPUT"

      - name: Install lint toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements/lint.txt

      - name: Run curated CI on the release ref
        # The bf-precommit suite is the curated lint gate (ADR-0005). It runs
        # against the checked-out release ref (main HEAD).
        run: |
          set -euo pipefail
          pre-commit run --all-files --hook-stage manual


      - name: Create and push the annotated release tag
        id: tag
        env:
          GIT_TAG: ${{ steps.resolve.outputs.git_tag }}
          RELEASE_REF: ${{ steps.resolve.outputs.release_ref }}
          UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git tag -a "$GIT_TAG" "$RELEASE_REF" \
            -m "bf-vllm release ${GIT_TAG} (upstream ${UPSTREAM_TAG})"
          git push origin "refs/tags/${GIT_TAG}"

      - name: Generate release notes
        id: notes
        env:
          GIT_TAG: ${{ steps.resolve.outputs.git_tag }}
          # Floor = prior bf release, else the upstream base tag (first release)
          # — never an open-ended whole-history range (would exceed GitHub's
          # 125k-char release-body limit).
          NOTES_FLOOR: ${{ steps.resolve.outputs.notes_floor }}
          RELEASE_REF: ${{ steps.resolve.outputs.release_ref }}
          IMAGE_TARGETS: ${{ github.event.inputs.image_targets }}
        run: |
          set -euo pipefail
          # The generator lives in bf-tools/ and imports its sibling version.py
          # via a flat import, so it must run from that directory.
          ( cd bf-tools && python generate-release-notes.py \
              --version "$GIT_TAG" \
              --ref "$RELEASE_REF" \
              --image-targets "$IMAGE_TARGETS" \
              --prev-tag "$NOTES_FLOOR" \
              --repo-dir .. ) > release-notes.md
          echo "Generated release-notes.md ($(wc -l < release-notes.md) lines)."

          # Defensive: GitHub's release body hard limit is 125000 chars. The
          # scoped range above keeps us far under it, but never let an unexpected
          # blow-up 422 the release — truncate with a pointer to the full diff.
          MAX=120000
          if [ "$(wc -c < release-notes.md)" -gt "$MAX" ]; then
            full="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${NOTES_FLOOR}...${GIT_TAG}"
            head -c "$MAX" release-notes.md > release-notes.trunc
            printf '\n\n_…release notes truncated; see the full diff: %s_\n' "$full" >> release-notes.trunc
            mv release-notes.trunc release-notes.md
            echo "::warning::Release notes exceeded ${MAX} chars; truncated with a compare link."
          fi

      - name: Create the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GIT_TAG: ${{ steps.resolve.outputs.git_tag }}
        run: |
          set -euo pipefail
          gh release create "$GIT_TAG" \
            --repo "$REPO" \
            --title "bf-vllm $GIT_TAG" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Build Slack release message
        id: slack-msg
        # always(): a FAILED release must announce itself too — a broken release
        # is more important to surface than a clean one, and silent CI failure is
        # exactly what we want to avoid. Gated only on the shared bot token
        # (GitHub forbids `secrets` in a step `if:`, so read the job-level env).
        # Same bot-token + Block Kit + chat.postMessage convention as
        # bf-sync-upstream and the bf-build-notify action.
        #
        # The message is a structured Block Kit card mirroring ai-platform's
        # deploy/release cards:
        #   header  — ":rocket: bf-vllm <version> released" (success) /
        #             ":x: bf-vllm release FAILED — <version>" (failure).
        #   section.fields — a two-column grid of release facts (Version,
        #             Upstream tag/commit, BF version, Channel, Image tags,
        #             Actor, Status). Each is taken from the resolve step's
        #             outputs; any may be empty if the run failed before resolve,
        #             so every field degrades to "—" rather than breaking.
        #   section  — "What's Changed": the head of the GitHub release body
        #             (bf-tools/generate-release-notes.py output, lightly mapped
        #             from GitHub markdown to Slack mrkdwn and truncated to the
        #             3000-char block limit with a link out). Present only on a
        #             successful release, where release-notes.md exists.
        #   actions  — "View Release" + "View Run" buttons (View Run is styled
        #             danger on failure); the release button is omitted when no
        #             release was created.
        #   context  — "Triggered by <actor> | <run>".
        # jq builds the JSON so every dynamic field is escaped; --slurpfile feeds
        # the optional changelog block array in (empty on failure).
        if: ${{ always() && env.SLACK_BOT_TOKEN != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          GIT_TAG: ${{ steps.resolve.outputs.git_tag }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          UPSTREAM_TAG: ${{ steps.resolve.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
          BF_VERSION: ${{ steps.resolve.outputs.bf_version }}
          IMAGE_TARGETS: ${{ github.event.inputs.image_targets }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          CHANNEL: ${{ env.SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/slack-payload.json"
          tag_disp="${GIT_TAG:-(unresolved)}"
          release_url="${GITHUB_SERVER_URL}/${REPO}/releases/tag/${GIT_TAG}"

          # Backslash-escape Slack mrkdwn formatting chars in the actor login so
          # an underscore/asterisk in a username renders literally instead of as
          # italic/bold. jq --arg already prevents JSON injection; this is the
          # separate mrkdwn layer.
          actor_disp="$(printf '%s' "${ACTOR:-—}" | sed -E 's/([*_~`])/\\\1/g')"

          # Image-tag pull strings, one per arch target the release builds (the
          # same GHCR repos generate-release-notes.py renders). Shown as the tags
          # the release WILL publish — release-channel image builds are still
          # deferred in this workflow (see the DEFERRED step above), so they are
          # marked pending rather than claimed as pushed.
          images_field="—"
          if [ -n "${IMAGE_TAG:-}" ]; then
            lines=""
            IFS=',' read -ra targets <<< "${IMAGE_TARGETS:-nvidia,rocm,cpu,cpu-bench}"
            for t in "${targets[@]}"; do
              t="$(echo "$t" | tr -d '[:space:]')"
              case "$t" in
                nvidia)   image_repo="ghcr.io/blackfuel-ai/bf-vllm/vllm" ;;
                rocm)     image_repo="ghcr.io/blackfuel-ai/bf-vllm/vllm-rocm" ;;
                cpu)      image_repo="ghcr.io/blackfuel-ai/bf-vllm/vllm-cpu" ;;
                cpu-bench) image_repo="ghcr.io/blackfuel-ai/bf-vllm/vllm-cpu-bench" ;;
                *)        image_repo="" ;;
              esac
              if [ -n "$image_repo" ]; then
                lines+="\`${image_repo}:${IMAGE_TAG}\`"$'\n'
              fi
            done
            [ -n "$lines" ] && images_field="${lines%$'\n'} _(pending build)_"
          fi

          upstream_field="\`${UPSTREAM_TAG:-—}\`"
          if [ -n "${UPSTREAM_SHA:-}" ]; then
            upstream_field="${upstream_field} (\`${UPSTREAM_SHA:0:12}\`)"
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            header=":rocket: bf-vllm ${tag_disp} released"
            text="bf-vllm ${tag_disp} released"
          else
            header=":x: bf-vllm release FAILED — ${tag_disp}"
            text="bf-vllm release ${tag_disp} FAILED"
          fi

          # "What's Changed" block — only on a successful release, where the
          # GitHub release body (release-notes.md) was generated above. Map the
          # generator's GitHub markdown to Slack mrkdwn (headings -> bold,
          # [text](url) -> <url|text>, list bullets kept) and truncate to the
          # 3000-char block limit, linking out to the full release for the rest.
          changelog_blocks="[]"
          if [ "$JOB_STATUS" = "success" ] && [ -f release-notes.md ]; then
            md="$(
              sed -E \
                -e 's/^#{1,6}[[:space:]]+(.*[^[:space:]])[[:space:]]*$/*\1*/' \
                -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
                release-notes.md
            )"
            limit=2800
            if [ "${#md}" -gt "$limit" ]; then
              md="${md:0:$limit}…"$'\n\n'"<${release_url}|View the full release on GitHub>"
            fi
            changelog_blocks="$(
              jq -n --arg md "$md" \
                '[ {type:"section",text:{type:"mrkdwn",text:("*What'"'"'s Changed*\n"+$md)}} ]'
            )"
          fi
          printf '%s' "$changelog_blocks" > "$RUNNER_TEMP/changelog.json"

          # Action buttons: View Release (omitted if no release was created) and
          # View Run (danger-styled on failure, like ai-platform's failure card).
          action_elems="$(
            jq -n --arg run "$RUN_URL" --arg rel "$release_url" \
              --arg status "$JOB_STATUS" --arg have_rel "${GIT_TAG:+yes}" '
              ( if $have_rel == "yes"
                  then [{type:"button",text:{type:"plain_text",text:"View Release",emoji:true},url:$rel}]
                  else [] end )
              + [ ( {type:"button",text:{type:"plain_text",text:"View Run",emoji:true},url:$run}
                    + (if $status == "success" then {} else {style:"danger"} end) ) ]'
          )"

          jq -n \
            --arg channel "$CHANNEL" \
            --arg text "$text" \
            --arg h "$header" \
            --arg version "$tag_disp" \
            --arg upstream "$upstream_field" \
            --arg bf "${BF_VERSION:-—}" \
            --arg images "$images_field" \
            --arg actor "$actor_disp" \
            --arg status "$JOB_STATUS" \
            --arg run "$RUN_URL" \
            --argjson actions "$action_elems" \
            --slurpfile changelog "$RUNNER_TEMP/changelog.json" '
            { channel: $channel,
              text: $text,
              blocks: ( [
                {type:"header",text:{type:"plain_text",text:$h,emoji:true}},
                {type:"section",fields:[
                  {type:"mrkdwn",text:("*Version:*\n`"+$version+"`")},
                  {type:"mrkdwn",text:("*Upstream:*\n"+$upstream)},
                  {type:"mrkdwn",text:("*BF version:*\n`"+$bf+"`")},
                  {type:"mrkdwn",text:("*Channel:*\n`release`")},
                  {type:"mrkdwn",text:("*Status:*\n`"+$status+"`")},
                  {type:"mrkdwn",text:("*Actor:*\n"+$actor)},
                  {type:"mrkdwn",text:("*Image tags:*\n"+$images)}
                ]}
              ]
              + $changelog[0]
              + [
                {type:"actions",elements:$actions},
                {type:"context",elements:[
                  {type:"mrkdwn",text:("Triggered by "+$actor+" | <"+$run+"|workflow run>")}
                ]}
              ] ) }' > "$payload_file"
          echo "payload_file=${payload_file}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (optional)
        if: ${{ always() && env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ steps.slack-msg.outputs.payload_file }}

  # Dispatch the per-arch release-channel image builds as an explicit matrix —
  # one row per target, each carrying its own workflow file (and, for nvidia,
  # the CUDA arch list). The grid is visible here rather than hidden in a bash
  # loop, so a release run shows exactly what is triggered. The per-provider
  # build mechanics stay in their own bf-build-<target>-image.yml (ADR: four
  # separate per-provider files, no monolith); this job only fans out to them.
  dispatch-builds:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One row per release image target. `name` is matched against the
    # image_targets input so the operator can subset a release; `workflow` is
    # the per-provider build file; `arch_list` is forwarded to nvidia only when
    # non-empty (empty = nvidia's own default; the other providers take no arch
    # input). Add a target by adding a row.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvidia
            workflow: bf-build-nvidia-image.yml
            # Empty = use the nvidia workflow's own default (9.0 10.0 = Hopper +
            # Blackwell). Set e.g. "8.9 9.0 10.0" here to also bake Ada/L40S into
            # the release image.
            arch_list: ""
          - name: rocm
            workflow: bf-build-rocm-image.yml
            arch_list: ""
          - name: cpu
            workflow: bf-build-cpu-image.yml
            arch_list: ""
          - name: cpu-bench
            workflow: bf-build-cpu-bench-image.yml
            arch_list: ""
    steps:
      - name: Mint bf-vllm-sync App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liG4vLDpTNkt8CLs
          private-key: ${{ secrets.BF_VLLM_SYNC_PRIVATE_KEY }}

      - name: Dispatch ${{ matrix.name }} release build
        # Skip rows the operator excluded via the image_targets input. The match
        # is on the comma-delimited list so a substring (e.g. "cpu" in
        # "cpu-bench") cannot false-match.
        if: ${{ contains(format(',{0},', github.event.inputs.image_targets), format(',{0},', matrix.name)) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          ARCH_LIST: ${{ matrix.arch_list }}
          GIT_TAG: ${{ needs.release.outputs.git_tag }}
          RELEASE_REF: ${{ needs.release.outputs.release_ref }}
        run: |
          set -euo pipefail
          # Defence-in-depth: although git_tag / release_ref are produced by the
          # release job (version.py-validated tag, `git rev-parse main` SHA) and
          # not free external input, reject any value that could be read as a
          # flag before it reaches `gh`. `gh ... -f key=value` already treats the
          # value literally, but a leading `-` is refused here so the dispatch
          # can never be steered by a `--`-prefixed value.
          for v in "$GIT_TAG" "$RELEASE_REF" "$ARCH_LIST"; do
            case "$v" in
              -*) echo "::error::refusing dispatch: value '${v}' starts with '-'." >&2; exit 1 ;;
            esac
          done

          # Distinguish "workflow absent" from a transient gh/auth error: capture
          # stderr instead of discarding it, so a network/permission failure is
          # surfaced rather than wrongly reported as a missing target.
          if ! view_err="$(gh workflow view "$WORKFLOW" --repo "$REPO" 2>&1 >/dev/null)"; then
            if printf '%s' "$view_err" | grep -qi 'could not find\|not found\|HTTP 404'; then
              echo "::error::release target workflow ${WORKFLOW} not found in ${REPO}." >&2
            else
              printf 'gh workflow view failed: %s\n' "$view_err" >&2
              echo "::error::could not query ${WORKFLOW} (not a not-found error); see the log above." >&2
            fi
            exit 1
          fi

          # nvidia takes an arch_list input; the other providers do not, so the
          # flag is only added when a non-empty arch_list is present.
          arch_arg=()
          if [ -n "$ARCH_LIST" ]; then
            arch_arg=(-f "arch_list=$ARCH_LIST")
          fi
          # --ref main: the workflow DEFINITION runs from main; the source it
          # builds is the release ref passed as the `ref` input. The build
          # derives its image tag from git_tag via bf-tools/version.py.
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref main \
            -f channel=release -f ref="$RELEASE_REF" -f git_tag="$GIT_TAG" \
            "${arch_arg[@]}"
          echo "::notice::Dispatched ${WORKFLOW} (channel=release ref=${RELEASE_REF} git_tag=${GIT_TAG}${ARCH_LIST:+ arch_list=${ARCH_LIST}})"
