# Manually-triggered ROCm image build, channel-aware (ADR-0004). The `channel`
# input selects the registry repo, tag scheme, OCI labels, and source. The
# source lever is REMOTE_VLLM (docker/Dockerfile.rocm):
#   upstream  REMOTE_VLLM=1 → the Dockerfile clones vllm-project/vllm @
#             VLLM_BRANCH (we resolve `ref` to a concrete upstream SHA);
#             Dockerfile.rocm comes from the calling bf-vllm ref. Dedicated
#             repo, path = channel signal:
#               ghcr.io/blackfuel-ai/bf-vllm/upstream/vllm-openai-rocm:sha-<short>
#               …:vX.Y.Z (upstream release tags); …:latest (upstream-main only)
#   dev       REMOTE_VLLM=0 → ONBUILD COPY ./ vllm/, i.e. the checked-out bf-vllm
#             tree IS the source. Shared repo, label-routed:
#               …/vllm-openai-rocm:<scm-version>-dev
#   release   REMOTE_VLLM=0 like dev, at the release ref via bf-release's git_tag:
#               …/vllm-openai-rocm:<upstream>_bf.<bf> + :<upstream>_bf-latest + :bf-stable
#
# Caching (ADR-0005): USE_SCCACHE=1 + empty SCCACHE_BUCKET_NAME = on-disk sccache
# at /sccache, a BuildKit cache mount the Blacksmith builder persists (no S3, no
# stickydisk action). Manual-only: ROCm builds are heavy.

name: bf-build-rocm-image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel (ADR-0004): upstream (bare upstream), dev (bf-vllm tree, preview), release (bf-vllm tree at a release tag)."
        type: choice
        required: true
        default: upstream
        options:
          - upstream
          - dev
          - release
      ref:
        description: "Source ref to build. upstream: a vLLM ref (branch/tag/SHA) or upstream-main. dev/release: a bf-vllm ref (branch/SHA/tag)."
        type: string
        required: false
        default: upstream-main
      git_tag:
        description: "Release git tag (release channel only), e.g. v0.23.1rc0+bf.0.1.0. Mapped to the OCI image tag via bf-tools/version.py."
        type: string
        required: false
        default: ""

concurrency:
  # One in-flight ROCm build per channel+ref; a newer dispatch cancels the older.
  group: bf-build-rocm-${{ github.event.inputs.channel }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # rocm/vllm-dev:base pinned by digest (gfx942/gfx950 = MI300/MI325). Refresh
  # by re-resolving the tag's digest.
  BASE_IMAGE: rocm/vllm-dev@sha256:251f19b4a8ac67b575e48dda34c5b0c5a0f400c55d919601c9c08eab9fd2868a

jobs:
  build-rocm:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 300
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # upstream checks out the calling ref (Dockerfile.rocm source; vLLM is
      # cloned in-build); dev/release check out `ref` itself (the tree that gets
      # COPYed as the source). fetch-depth: 0 for `git describe`.
      - name: Checkout bf-vllm
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.inputs.channel == 'upstream' && github.ref || github.event.inputs.ref }}
          fetch-depth: 0

      - name: Resolve channel, image repository, and provenance
        id: prov
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          REF: ${{ github.event.inputs.ref }}
          GIT_TAG: ${{ github.event.inputs.git_tag }}
          OWNER_IMAGE: ghcr.io/blackfuel-ai/bf-vllm
        run: |
          set -euo pipefail
          vllm_repo="https://github.com/vllm-project/vllm.git"

          case "$CHANNEL" in
            upstream)
              image="${OWNER_IMAGE}/upstream/vllm-openai-rocm"

              # Resolve `ref` to a concrete vLLM SHA for the in-Dockerfile clone.
              # upstream-main is a bf-vllm-only branch, so map it to the mirror
              # HEAD (a real vLLM commit, fetchable by SHA); other refs pass
              # through. source_sha is what we build (VLLM_BRANCH) and label.
              if [ "$REF" = "upstream-main" ]; then
                git fetch --depth 1 origin upstream-main
                source_sha="$(git rev-parse FETCH_HEAD)"
              else
                source_sha="$REF"
              fi
              # Prove it's fetchable from vLLM before the multi-hour build: a SHA
              # via `git fetch <sha>` (ls-remote can't see non-tip commits), a
              # tag/branch via ls-remote.
              # ref/source_sha are logged via %q (not interpolated into the
              # `::error::` directive, which a newline + `::` could hijack).
              if printf '%s' "$source_sha" | grep -Eqx '[0-9a-f]{40}'; then
                if git fetch --depth 1 "$vllm_repo" "$source_sha" >/dev/null 2>&1; then
                  echo "source_sha is fetchable from $vllm_repo."
                else
                  printf 'unfetchable ref / source_sha: %q / %q\n' "$REF" "$source_sha" >&2
                  echo "::error::ref looks like a SHA but is not fetchable from vLLM; pass a real vLLM commit, a tag/branch, or 'upstream-main'." >&2
                  exit 1
                fi
              elif git ls-remote --exit-code "$vllm_repo" "$source_sha" >/dev/null 2>&1; then
                echo "source_sha resolves on $vllm_repo."
              else
                printf 'unresolved ref / source_sha: %q / %q\n' "$REF" "$source_sha" >&2
                echo "::error::ref does not resolve as a tag/branch on vLLM; pass a valid vLLM ref or 'upstream-main'." >&2
                exit 1
              fi
              # version: set only when the ref is an upstream release tag.
              if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
                version="$REF"
              else
                version=""
              fi
              ;;
            dev|release)
              # Shared repository, label-routed. The checked-out tree IS the vLLM
              # source (REMOTE_VLLM=0), so source_sha is the tree HEAD and there is
              # no upstream clone to resolve.
              image="${OWNER_IMAGE}/vllm-openai-rocm"
              source_sha="$(git rev-parse HEAD)"
              version=""
              ;;
            *)
              echo "::error::Unknown channel '${CHANNEL}'." >&2
              exit 1
              ;;
          esac

          # scm_version: the tree's git-describe self-name (BF release line, else
          # upstream tag line), `+`->`_` for OCI. The fallback always resolves.
          scm_raw="$(git describe --tags --match 'v*+bf.*' HEAD 2>/dev/null \
                  || git describe --tags --match 'v[0-9]*' HEAD)"
          scm_version="${scm_raw//+/_}"

          # Release identity from git_tag via version.py. Single-line `python -c`
          # (an indented `<<'PY'` heredoc would raise IndentationError); explicit
          # exit check so a bad git_tag fails loudly instead of yielding empty
          # tags (a `read < <(python …)` swallows the substituted exit).
          bf_image_tag=""
          bf_version=""
          bf_upstream=""
          if [ "$CHANNEL" = "release" ]; then
            if [ -z "$GIT_TAG" ]; then
              echo "::error::channel=release requires git_tag (e.g. v0.23.1rc0+bf.0.1.0)." >&2
              exit 1
            fi
            # git_tag is never interpolated into `::error::` (a newline + `::`
            # could smuggle a workflow command); logged via %q instead.
            if ! bf_fields="$(python -c 'import sys; sys.path.insert(0, "bf-tools"); from version import parse_git_tag; v = parse_git_tag(sys.argv[1]); print(v.image_tag, v.bf, v.upstream)' "$GIT_TAG")"; then
              printf 'git_tag failed to parse: %q\n' "$GIT_TAG" >&2
              echo "::error::git_tag failed to parse via bf-tools/version.py (expected v<upstream>+bf.<bf>); see the value logged above." >&2
              exit 1
            fi
            read -r bf_image_tag bf_version bf_upstream <<< "$bf_fields"
            if [ -z "$bf_image_tag" ] || [ -z "$bf_version" ] || [ -z "$bf_upstream" ]; then
              echo "::error::release identity is incomplete (image_tag/bf/upstream); refusing to build with blank tags." >&2
              exit 1
            fi
          fi

          {
            echo "channel=${CHANNEL}"
            echo "image=${image}"
            echo "source_sha=${source_sha}"
            echo "source_short=${source_sha:0:7}"
            echo "version=${version}"
            echo "scm_version=${scm_version}"
            echo "bf_image_tag=${bf_image_tag}"
            echo "bf_version=${bf_version}"
            echo "bf_upstream=${bf_upstream}"
          } >> "$GITHUB_OUTPUT"

      # Sparse-checkout the composite action into bf-actions/ for parity with
      # the other builds (whose context isn't the bf-vllm root).
      - name: Checkout BF composite actions from the calling ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref_name }}
          path: bf-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.prov.outputs.image }}
          # Tags per channel (ADR-0004): upstream → :sha-<short> / :vX.Y.Z /
          # :latest (upstream-main); dev → :<scm-version>-dev; release →
          # immutable :<bf-image-tag> + moving :<upstream>_bf-latest / :bf-stable.
          tags: |
            type=raw,value=sha-${{ steps.prov.outputs.source_short }},enable=${{ steps.prov.outputs.channel == 'upstream' }}
            type=raw,value=${{ steps.prov.outputs.version }},enable=${{ steps.prov.outputs.channel == 'upstream' && steps.prov.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.prov.outputs.channel == 'upstream' && github.event.inputs.ref == 'upstream-main' }}
            type=raw,value=${{ steps.prov.outputs.scm_version }}-dev,enable=${{ steps.prov.outputs.channel == 'dev' }}
            type=raw,value=${{ steps.prov.outputs.bf_image_tag }},enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=${{ steps.prov.outputs.bf_upstream }}_bf-latest,enable=${{ steps.prov.outputs.channel == 'release' }}
            type=raw,value=bf-stable,enable=${{ steps.prov.outputs.channel == 'release' }}
          # ai.vllm.* keep upstream semantics (build.commit = the vLLM source
          # built); ai.bf-vllm.* hold BF provenance. image.tag = the upstream
          # tag (ADR-0004), bf.version on release only.
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.title=vLLM (Blackfuel, ROCm)
            org.opencontainers.image.vendor=Blackfuel
            org.opencontainers.image.version=${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.version || steps.prov.outputs.scm_version) }}
            ai.vllm.image.tag=${{ steps.prov.outputs.version || steps.prov.outputs.bf_upstream }}
            ai.vllm.build.commit=${{ steps.prov.outputs.source_sha }}
            ai.bf-vllm.build.commit=${{ github.sha }}
            ai.bf-vllm.build.channel=${{ steps.prov.outputs.channel }}
            ai.bf-vllm.bf.version=${{ steps.prov.outputs.bf_version }}
            ai.bf-vllm.scm.version=${{ steps.prov.outputs.scm_version }}

      # REMOTE_VLLM selects the source: 1 = clone vLLM @ VLLM_BRANCH (upstream);
      # 0 = COPY the checked-out tree (dev/release). sccache per the header.
      - name: Build and push ROCm image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: docker/Dockerfile.rocm
          # Pin the OpenAI-server stage explicitly. docker/Dockerfile.rocm's
          # last stage is vllm-openai today (root, ENTRYPOINT vllm serve), so an
          # unpinned build resolves to it by accident of ordering; pinning makes
          # the published image deterministic if a later stage is ever appended.
          # Matches stock vllm/vllm-openai, the form the engine consumes.
          target: vllm-openai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            REMOTE_VLLM=${{ steps.prov.outputs.channel == 'upstream' && '1' || '0' }}
            VLLM_REPO=https://github.com/vllm-project/vllm.git
            VLLM_BRANCH=${{ steps.prov.outputs.source_sha }}
            USE_SCCACHE=1
            SCCACHE_BUCKET_NAME=

      # Measure pushed image size, write the STEP_SUMMARY metrics table, and post
      # a Block Kit build summary to Slack — all in one shared composite action
      # (.github/actions/bf-build-notify). always() so a failed build still
      # reports; fails closed to '—'. Slack is gated on the token below.
      - name: Report build outcome
        if: always()
        uses: ./bf-actions/.github/actions/bf-build-notify
        with:
          image: ${{ steps.prov.outputs.image }}
          image-tag: ${{ steps.prov.outputs.channel == 'release' && steps.prov.outputs.bf_image_tag || (steps.prov.outputs.channel == 'dev' && format('{0}-dev', steps.prov.outputs.scm_version) || (steps.prov.outputs.version || format('sha-{0}', steps.prov.outputs.source_short))) }}
          display-name: vllm-openai-rocm
          summary-title: ROCm ${{ steps.prov.outputs.channel }} build
          arch-list: gfx942 gfx950
          runner-default: blacksmith-16vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
