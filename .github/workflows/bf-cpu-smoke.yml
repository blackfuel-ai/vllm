# .github/workflows/bf-cpu-smoke.yml
#
# Tier-0 functional smoke test (ADR-0007). This is bf-vllm's FIRST functional
# CI gate: every other workflow (bf-lint, bf-precommit, bf-classification-lint,
# bf-patches-trailer-lint, bf-pr-review) checks discipline and lint but NEVER
# imports vLLM or runs a line of model code. A PR could break `import vllm`, a
# CPU kernel, or the sampler and stay green. This closes that gap on the
# cheapest tier: CPU-only, no GPU runner, no model download.
#
# What it does (T0 per ADR-0007):
#   1. Builds vLLM from source for CPU (VLLM_TARGET_DEVICE=cpu), mirroring the
#      host-side incantation in docker/Dockerfile.cpu (apt deps -> pinned
#      protoc -> Rust frontend `vllm-rs` -> editable install). We build on the
#      bare runner rather than via the Dockerfile so the uv + ccache + cargo
#      caches persist across runs on the Blacksmith sticky disk; a Docker build
#      would re-import the world into a fresh image layer each PR.
#   2. Asserts `import vllm` succeeds and prints the version.
#   3. Runs a curated, CPU-safe slice of the inherited upstream `tests/` tree —
#      pure-Python / import-level tests that need neither a GPU nor a model
#      download. This is the payoff for the sync workflow (ADR-0002): upstream
#      drift that breaks our [bf-patch]es or `bf/files` goes red on the [sync]
#      PR BEFORE merge instead of surfacing in production.
#
# Why this gates [sync] PRs too (deliberately NOT exempt, unlike
# bf-patches-trailer-lint): a sync's entire reason for existing as a risk is
# that it drops hundreds of upstream commits onto `main`. That is precisely
# when we most want a functional floor. The trailer-lint exemption is about
# commit-message discipline (irrelevant to upstream commits); a functional
# smoke is about whether the merged tree still imports and runs.
#
# CURATED-SET MAINTENANCE (ADR-0007 Consequences): the file list below is
# inherited from upstream and upstream MOVES/RENAMES test files. The list was
# re-verified against `main` when this workflow landed (several originally
# proposed paths — test_sampling_params.py, test_logits_processor.py,
# tests/tokenization/, test_utils.py — had already moved/renamed upstream and
# were replaced). When a sync deletes/renames one of these, this job fails on
# collection; fix forward by repointing at the moved file (or dropping it).
#
# Runner: blacksmith-4vcpu-ubuntu-2404. Same free-tier CPU class the
# bf-build-cpu image build already targets, so the runner label is already
# declared in .github/actionlint.yaml (ADR-0005) and the Blacksmith sticky-disk
# cache plane is co-located with the runner. 4 vCPU keeps the C++ compile from
# OOMing (see bf-build-cpu-image: 32 concurrent cc1plus exhaust RAM); bump to
# blacksmith-8vcpu-ubuntu-2404 if the cold compile overruns the time budget.
#
# Status: ships as a NORMAL (non-required) check. The operator marks it
# `required` on `main` after a few green runs confirm the cold-build time and
# the curated set are stable. Until then it is advisory.

name: bf-cpu-smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vLLM's supported Python (docker/Dockerfile.cpu default; pyproject pins
  # >=3.10,<3.15). Keep in lockstep with the Dockerfile's PYTHON_VERSION ARG.
  PYTHON_VERSION: "3.12"
  # CPU build env, lifted verbatim from docker/Dockerfile.cpu (base-common):
  # gcc-12 toolchain + ccache-backed compile.
  CC: /usr/bin/gcc-12
  CXX: /usr/bin/g++-12
  CCACHE_DIR: /home/runner/.cache/ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # Cap the C++ parallel compile to the runner's vCPU count. The CPU build
  # otherwise defaults MAX_JOBS high and OOMs a 4 vCPU box (see
  # bf-build-cpu-image-from-upstream.yml).
  MAX_JOBS: "4"
  CARGO_BUILD_JOBS: "4"
  # uv: CPU torch wheels + generous network timeout (Dockerfile.cpu values).
  UV_HTTP_TIMEOUT: "500"
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  cpu-smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Cold compile of the vLLM CPU extension + Rust frontend dominates the
    # first run; warm runs (uv/ccache/cargo cache hit) land in the ~8-10 min
    # target. 45 min caps a cache-cold or cache-busted run well under GitHub's
    # 360 min hard kill while leaving headroom for a from-scratch compile.
    timeout-minutes: 45
    steps:
      # Third-party actions pinned by 40-char commit SHA + commented tag per
      # the supply-chain hygiene rule (CLAUDE.md / AGENTS.md). Bump deliberately.
      - name: Checkout PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Build needs .git present: setup.py / setuptools-scm read it for the
          # version, and tools/check_repo.sh inspects history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # Bust the uv cache when CPU build/runtime requirements change.
          cache-dependency-glob: |
            requirements/cpu.txt
            requirements/build/cpu.txt
            requirements/common.txt

      # ccache + cargo registry caches persist the expensive compile artifacts
      # across runs. Keyed on the requirement/toolchain fingerprints so an
      # upstream torch/toolchain bump starts a fresh (correct) cache lineage.
      - name: Restore ccache
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: bf-cpu-smoke-ccache-${{ runner.os }}-${{ hashFiles('requirements/build/cpu.txt', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            bf-cpu-smoke-ccache-${{ runner.os }}-${{ hashFiles('requirements/build/cpu.txt', 'rust-toolchain.toml') }}-
            bf-cpu-smoke-ccache-${{ runner.os }}-

      - name: Restore cargo registry
        uses: useblacksmith/cache@c5fe29eb0efdf1cf4186b9f7fcbbcbc0cf025662 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: bf-cpu-smoke-cargo-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            bf-cpu-smoke-cargo-${{ runner.os }}-

      # System build deps, lifted from docker/Dockerfile.cpu (base-common):
      # gcc-12/g++-12 toolchain, ccache, numa, tcmalloc, plus the pinned protoc
      # the Rust frontend's build.rs needs (tools/install_protoc.sh).
      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ccache git curl wget ca-certificates zlib1g-dev \
            gcc-12 g++-12 libtcmalloc-minimal4 libnuma-dev jq lsof make xz-utils unzip
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 10 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
          sudo PROTOC_VERSION=34.2 bash tools/install_protoc.sh

      # Build the Rust frontend (`vllm-rs`) the same way Dockerfile.cpu's
      # rust-build stage does; setup.py picks up the prebuilt artifacts and
      # skips an in-tree rebuild.
      - name: Build Rust frontend (vllm-rs)
        run: |
          set -euo pipefail
          bash build_rust.sh

      - name: CPU build + install vLLM (editable)
        run: |
          set -euo pipefail
          uv pip install --system -r requirements/build/cpu.txt
          # VLLM_TARGET_DEVICE=cpu is the canonical CPU build switch
          # (docker/Dockerfile.cpu). Editable install so the curated tests
          # import the freshly built extension.
          VLLM_TARGET_DEVICE=cpu uv pip install --system -e . --no-build-isolation

      - name: Import check
        id: import
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import vllm; print(vllm.__version__)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vLLM import OK: ${VERSION}"

      - name: Install curated-test dependencies
        run: |
          set -euo pipefail
          # The curated tests below are import/pure-Python tests, but the root
          # tests/conftest.py is imported for any test under tests/ and pulls
          # tblib + pytest-asyncio. vllm_test_utils backs tests/utils.py.
          uv pip install --system pytest pytest-asyncio tblib
          uv pip install --system -e tests/vllm_test_utils

      - name: Run curated CPU-safe tests
        id: pytest
        env:
          # Force the CPU platform and eager paths; never reach for a GPU.
          VLLM_TARGET_DEVICE: cpu
          # Curated CPU-safe set — re-verified present on main (ADR-0007).
          # Pure-Python / import-level only: no GPU, no model download.
          # Excluded deliberately: tests/test_regression.py (instantiates real
          # LLM(...) models -> HF download + inference, too heavy/networked for
          # a smoke); tokenizer tests (network-fetch a tokenizer).
          CURATED_TESTS: >-
            tests/test_sequence.py
            tests/test_outputs.py
            tests/test_logger.py
            tests/test_version.py
            tests/test_envs.py
            tests/test_scalartype.py
            tests/transformers_utils/test_utils.py
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python -m pytest -v -p no:cacheprovider $CURATED_TESTS

      - name: Write run summary
        if: always()
        env:
          VLLM_VERSION: ${{ steps.import.outputs.version }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "## bf-cpu-smoke (Tier-0 functional) — summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| \`import vllm\` | ${IMPORT_OUTCOME:-skipped} (version: ${VLLM_VERSION:-n/a}) |"
            echo "| curated CPU pytest | ${PYTEST_OUTCOME:-skipped} |"
            echo
            echo "Curated set (CPU-safe, no GPU, no model download):"
            echo "\`test_sequence test_outputs test_logger test_version test_envs test_scalartype transformers_utils/test_utils\`"
            echo
            echo "Tier-0 of the ADR-0007 functional-test strategy. GPU-smoke (T1)"
            echo "and on-demand kernel-test (T2) tiers are tracked there."
          } >> "$GITHUB_STEP_SUMMARY"
