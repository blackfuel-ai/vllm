# .github/workflows/bf-build-cpu-image-from-upstream.yml
#
# Manually-triggerable CPU image build off bare upstream source. Produces the
# `upstream` channel (ADR-0004): no Blackfuel patch layer, our Dockerfile,
# upstream's vLLM source. Pushes to GHCR as:
#
#   ghcr.io/blackfuel-ai/bf-vllm/vllm-cpu:upstream-<sha>
#   ghcr.io/blackfuel-ai/bf-vllm/vllm-cpu:upstream-latest
#
# The CPU image is the lightest of the three providers — no GPU toolchain, no
# CUDA/HIP kernel compilation. It serves models on CPU for testing without GPUs
# and backs `vllm bench` runs. Per ADR-0005 the velocity lever here is the
# Blacksmith-native builder cache (Docker layer + compiler-output caching,
# co-located with the runner); vLLM's built-in `USE_SCCACHE` is deliberately
# left off (ADR-0005 §Consequences) — a second on-disk sccache plane is
# redundant on top of the Blacksmith builder and unnecessary for a build this
# light. No sticky-disk/sccache setup is wired for the same reason.
#
# Dispatched by every sync for the `upstream-main` ref so a new upstream model
# is servable within minutes of landing (Goal #1). Also runnable by hand for a
# specific tag via the `upstream_ref` input.

name: bf-build-cpu-image-from-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Bare-upstream ref to build (branch, tag, or SHA)."
        type: string
        required: true
        default: upstream-main

permissions:
  contents: read
  packages: write

concurrency:
  group: bf-build-cpu-upstream-${{ github.event.inputs.upstream_ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/blackfuel-ai/bf-vllm/vllm-cpu

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Record build start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.inputs.upstream_ref }}

      - name: Resolve build provenance
        id: prov
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse HEAD)"
          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_short=${upstream_sha:0:7}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # `:upstream-<sha>` is immutable per build. `:upstream-latest` means
          # "newest bare-upstream-HEAD build" (ADR-0004) — it is only moved by
          # the upstream-main build (the sync's caller), so an ad-hoc dispatch
          # of a feature ref publishes only its immutable :upstream-<sha> tag
          # and never clobbers the shared moving tag.
          tags: |
            type=raw,value=upstream-${{ steps.prov.outputs.upstream_short }}
            type=raw,value=upstream-latest,enable=${{ github.event.inputs.upstream_ref == 'upstream-main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/blackfuel-ai/bf-vllm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.title=vLLM (Blackfuel, CPU)
            org.opencontainers.image.vendor=Blackfuel
            org.opencontainers.image.version=upstream-${{ steps.prov.outputs.upstream_short }}
            ai.vllm.build.commit=${{ steps.prov.outputs.upstream_sha }}
            ai.bf-vllm.build.commit=${{ github.sha }}
            ai.bf-vllm.build.channel=upstream

      - name: Build and push CPU image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: vllm-openai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cap parallel C++ compile jobs to the runner's vCPU count. The CPU
          # Dockerfile defaults max_jobs=32; 32 concurrent cc1plus processes on
          # this blacksmith-4vcpu runner exhaust RAM mid-compile and the build
          # dies with "cannot allocate memory" (cc1plus Killed). max_jobs is a
          # declared ARG in docker/Dockerfile.cpu, so this build-arg reaches the
          # upstream-sourced build context.
          build-args: |
            max_jobs=4

      # Measure pushed image size, write the STEP_SUMMARY metrics table, and
      # post a Block Kit build summary to Slack — all in one shared composite
      # action (.github/actions/bf-build-notify). always() so a failed build
      # still reports; fails closed to '—'. Slack is gated on the token below.
      - name: Report build outcome
        if: always()
        uses: ./.github/actions/bf-build-notify
        with:
          image: ${{ env.IMAGE }}
          tag: upstream-${{ steps.prov.outputs.upstream_short }}
          display-name: vllm-cpu
          summary-title: CPU from-upstream build
          runner-default: blacksmith-4vcpu
          started-epoch: ${{ steps.started.outputs.epoch }}
          build-outcome: ${{ steps.build.outcome }}
          digest: ${{ steps.build.outputs.digest }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
